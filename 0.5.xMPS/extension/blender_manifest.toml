schema_version = "1.0.0"
id = "corridorkey_mps_compositor"
version = "0.5.1"
name = "CorridorKey MPS Node (Experimental)"
tagline = "Key green-screen footage with CorridorKey2.0"
maintainer = "Samuel Kremer (e1samu)"
type = "add-on"
tags = ["Compositing"]
blender_version_min = "5.3.0"
license = ["SPDX:GPL-3.0-or-later"]
platforms = ["macos-arm64"]

[permissions]
files = "Read footage and models and write keyed frames"
network = "Download local runtimes and models on request"

[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
